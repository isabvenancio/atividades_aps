name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  backend:
    name: Backend (lint e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trabalho Final/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend (lint e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trabalho Final/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
